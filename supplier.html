
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makrana Marble Hub - Supplier</title>
<style>
body{font-family:Arial;background:#111;color:#f5f0e5;padding:16px}
.card{max-width:500px;margin:20px auto;background:#202020;padding:22px;border:1px solid #b99a58;border-radius:14px}
h1{color:#d6b56d}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;font-size:16px;border-radius:7px}
input{background:#111;color:white;border:1px solid #777}
button{background:#d6b56d;border:0;font-weight:bold}
a{color:#e5c77e}
label{display:block;margin-top:10px}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
<h1>Makrana Marble Hub</h1>
<h2>Supplier Dashboard</h2>
<p>Add your marble product</p>

<form id="productForm">
<label>Marble name / मार्बल का नाम</label>
<input id="productName" required placeholder="Makrana White Marble">

<label>Saudi price (SAR ﷼)</label>
<input id="priceSar" type="number" min="0.01" step="0.01" required placeholder="مثال: 250">

<label>India price (INR ₹)</label>
<input id="priceInr" type="number" min="0.01" step="0.01" required placeholder="उदाहरण: 6000">

<label>Marble photo (max 5 MB)</label>
<input id="photo" type="file" accept="image/*" required>

<button type="submit">Upload Marble Product</button>
</form>

<p id="message" role="status"></p>
<p><a href="account.html">Login / Account</a></p>
<p><a href="./">Back to website</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client = window.supabase.createClient(
  "https://icnwkvqzaxpyimgnobjj.supabase.co",
  "sb_publishable_Sgmu4M0QkssHuCd6bWzPEw_ip5-U_Ir"
);

document.getElementById("productForm").addEventListener("submit", async e => {
  e.preventDefault();
  const message = document.getElementById("message");
  message.textContent = "Please wait...";

  let uploadedPath = null;

  try {
    const { data: authData, error: authError } = await client.auth.getUser();
    if (authError || !authData.user) {
      throw new Error("Please login first using your account.");
    }

    const user = authData.user;
    const productName = document.getElementById("productName").value.trim();
    const priceSar = Number(document.getElementById("priceSar").value);
    const priceInr = Number(document.getElementById("priceInr").value);
    const file = document.getElementById("photo").files[0];

    if (!file || file.size > 5 * 1024 * 1024) {
      throw new Error("Choose a photo smaller than 5 MB.");
    }
    if (!Number.isFinite(priceSar) || priceSar <= 0 ||
        !Number.isFinite(priceInr) || priceInr <= 0) {
      throw new Error("Enter both prices greater than zero.");
    }

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    uploadedPath = user.id + "/" + Date.now() + "-" + safeName;

    const { error: uploadError } = await client.storage
      .from("marble-photos")
      .upload(uploadedPath, file, { upsert: false });

    if (uploadError) throw uploadError;

    const { data: urlData } = client.storage
      .from("marble-photos")
      .getPublicUrl(uploadedPath);

    const { error: insertError } = await client
      .from("marble_products")
      .insert({
        product_name: productName,
        price: priceSar,
        price_sar: priceSar,
        price_inr: priceInr,
        image_url: urlData.publicUrl,
        supplier_id: user.id
      });

    if (insertError) throw insertError;

    message.textContent = "Product uploaded successfully!";
    document.getElementById("productForm").reset();
  } catch (error) {
    message.textContent = error.message || "Upload failed. Please try again.";
  }
});
</script>
</body>
</html>
